name: Android Fastlane Build

on:
  push:
    branches:
      - test          # or your branch name
  workflow_dispatch:  # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2  # match your local version if needed
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          gem uninstall -aIx bundler || true
          gem install bundler:2.5.6
          bundle _2.5.6_ install

      - name: Decrypt Firebase key
        run: |
          echo "${{ secrets.FIREBASE_KEY_JSON }}" > android/fastlane/firebase_builds_key.json

      - name: Build with Fastlane
        working-directory: android
        run: bundle exec fastlane android build_release
